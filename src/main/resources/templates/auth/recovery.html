<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{recovery.page.title}">Recuperar contraseña - Sistema Electoral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <script th:inline="javascript">
        const CTX = /*[[@{/}]]*/ '/';
        window.__i18n = {
            validationRequired: /*[[#{recovery.validation.required}]]*/ 'Campo obligatorio',
            validationDniFormat: /*[[#{recovery.validation.dni.format}]]*/ 'Debe tener 8 dígitos'
        };
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#e8edf3', 100: '#c5d1e0', 200: '#9eb3cc',
                            300: '#7795b8', 400: '#5a7ea8', 500: '#3d6799',
                            600: '#2d5280', 700: '#1e3a5f', 800: '#152d4a', 900: '#0d1f33',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary-700 via-primary-800 to-primary-900 flex items-center justify-center p-4">

<div x-data="{
        form: { dni: '' },
        errors: {},
        validate() {
            this.errors = {}
            if (!this.form.dni.trim()) {
                this.errors.dni = window.__i18n.validationRequired;
            } else if (!/^\d{8}$/.test(this.form.dni.trim())) {
                this.errors.dni = window.__i18n.validationDniFormat;
            }
            return Object.keys(this.errors).length === 0;
        },
        submit() {
            if (this.validate()) this.$refs.recoveryForm.submit();
        }
     }" class="w-full max-w-md">

    <div class="rounded-2xl bg-white px-8 py-10 shadow-2xl">

        <!-- Header -->
        <div class="mb-6 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-primary-600/10">
                <i data-lucide="key-round" class="h-7 w-7 text-primary-600"></i>
            </div>
            <h1 class="text-lg font-bold text-zinc-900" th:text="#{recovery.header.title}">Sistema Electoral</h1>
            <p class="mt-1 text-xs text-zinc-400" th:text="#{recovery.header.subtitle}">Elecciones Generales 2026</p>
        </div>

        <div class="mb-5 border-b border-zinc-200 pb-4">
            <h2 class="text-center text-sm font-semibold uppercase tracking-wider text-primary-700">
                <i data-lucide="refresh-ccw-dot" class="mr-1.5 inline-block h-4 w-4"></i>
                <span th:text="#{recovery.section.title}">Recuperar contraseña</span>
            </h2>
            <p class="mt-2 text-center text-xs text-zinc-500" th:text="#{recovery.section.subtitle}">
                Sigue los pasos para restablecer tu contraseña
            </p>
        </div>

        <!-- Error block -->
        <div th:if="${recoveryError}"
             class="mb-4 flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-600">
            <i data-lucide="alert-circle" class="h-3.5 w-3.5 shrink-0"></i>
            <span th:text="${recoveryError}"></span>
        </div>

        <form x-ref="recoveryForm" th:action="@{/auth/voter/recovery/lookup}" method="post"
              class="flex flex-col gap-6" novalidate>

            <!-- DNI -->
            <div class="flex flex-col gap-1.5">
                <label for="dni" class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-zinc-600">
                    <i data-lucide="credit-card" class="h-3.5 w-3.5"></i>
                    <span th:text="#{recovery.form.dni.label}">DNI</span>
                </label>
                <input id="dni" type="text" name="dni" x-model="form.dni" maxlength="8"
                       :class="errors.dni ? 'border-b-red-500' : 'border-b-zinc-200 focus:border-b-primary-600'"
                       class="h-10 w-full border-0 border-b-2 bg-transparent px-0 text-sm outline-none transition-colors placeholder:text-zinc-400"
                       th:placeholder="#{recovery.form.dni.placeholder}"
                       placeholder="Ingresa tu DNI (8 dígitos)">
                <p x-show="errors.dni" x-cloak x-text="errors.dni" class="text-xs text-red-500"></p>
            </div>

            <!-- Submit -->
            <button type="button" @click="submit()"
                    class="flex w-full items-center justify-center gap-2 rounded-lg bg-primary-700 px-4 py-3 text-sm font-semibold uppercase tracking-wider text-white transition-colors hover:bg-primary-800">
                <i data-lucide="search" class="h-4 w-4"></i>
                <span th:text="#{recovery.form.submit}">Verificar datos</span>
            </button>

            <!-- Links -->
            <div class="flex flex-col items-center gap-2 text-center">
                <a th:href="@{/login/voter}"
                   class="inline-flex items-center gap-1 text-xs text-zinc-400 transition-colors hover:text-primary-600">
                    <i data-lucide="arrow-left" class="h-3 w-3"></i>
                    <span th:text="#{recovery.link.login}">Volver al inicio de sesión</span>
                </a>
            </div>

        </form>
    </div>

    <p class="mt-6 text-center text-xs text-white/60" th:text="#{recovery.footer}">Sistema Electoral - Lima Metropolitana</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });
</script>
</body>
</html>
