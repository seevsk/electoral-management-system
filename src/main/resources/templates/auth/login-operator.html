<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Electoral - Iniciar Sesion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <script th:inline="javascript">
        const CTX = /*[[@{/}]]*/ '/';
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#e8edf3', 100: '#c5d1e0', 200: '#9eb3cc',
                            300: '#7795b8', 400: '#5a7ea8', 500: '#3d6799',
                            600: '#2d5280', 700: '#1e3a5f', 800: '#152d4a',
                            900: '#0d1f33',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-primary-700 via-primary-800 to-primary-900 flex items-center justify-center p-4">

<div x-data="{
        form: { dni: '', password: '' },
        errors: {},
        validate() {
            this.errors = {}
            if (!this.form.dni.trim()) this.errors.dni = 'Este campo es obligatorio'
            if (!this.form.password.trim()) this.errors.password = 'Este campo es obligatorio'
            return Object.keys(this.errors).length === 0
        },
        submit() {
            if (this.validate()) this.$refs.loginForm.submit()
        }
     }" class="w-full max-w-md">

    <div class="rounded-2xl bg-white px-8 py-10 shadow-2xl">

        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-primary-600/10">
                <i data-lucide="vote" class="h-7 w-7 text-primary-600"></i>
            </div>
            <h1 class="text-lg font-bold text-zinc-900">Sistema Electoral</h1>
            <p class="mt-1 text-xs text-zinc-400">Elecciones Generales 2026</p>
        </div>

        <div class="mb-6 border-b border-zinc-200 pb-4">
            <h2 class="text-center text-sm font-semibold uppercase tracking-wider text-primary-700">
                <i data-lucide="file-spreadsheet" class="mr-1.5 inline-block h-4 w-4"></i>
                Inicio de Sesion - Operador Electoral
            </h2>
        </div>

        <div th:if="${loginError}"
             class="mb-4 flex items-center gap-2 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-600">
            <i data-lucide="alert-circle" class="h-3.5 w-3.5 shrink-0"></i>
            <span th:text="${loginError}"></span>
        </div>

        <form x-ref="loginForm" th:action="@{/auth/operator/login}" method="post"
              class="flex flex-col gap-6" novalidate>

            <div role="group" class="flex flex-col gap-2">
                <label for="dni" class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-zinc-600">
                    <i data-lucide="user" class="h-3.5 w-3.5"></i>
                    DNI
                </label>
                <input id="dni" type="text" name="dni" x-model="form.dni"
                       :class="errors.dni ? 'border-b-red-500' : 'border-b-zinc-200 focus:border-b-primary-600'"
                       class="h-10 w-full border-0 border-b-2 bg-transparent px-0 text-sm outline-none transition-colors placeholder:text-zinc-400"
                       placeholder="Ingresa tu DNI (8 digitos)" maxlength="8">
                <p x-show="errors.dni" x-cloak x-text="errors.dni"
                   class="flex items-center gap-1 text-xs text-red-500">
                    <i data-lucide="alert-circle" class="inline-block h-3 w-3"></i>
                </p>
            </div>

            <div role="group" class="flex flex-col gap-2">
                <label for="password" class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-zinc-600">
                    <i data-lucide="lock" class="h-3.5 w-3.5"></i>
                    Contrasena
                </label>
                <input id="password" type="password" name="password" x-model="form.password"
                       :class="errors.password ? 'border-b-red-500' : 'border-b-zinc-200 focus:border-b-primary-600'"
                       class="h-10 w-full border-0 border-b-2 bg-transparent px-0 text-sm outline-none transition-colors placeholder:text-zinc-400"
                       placeholder="Ingresa tu contrasena">
                <p x-show="errors.password" x-cloak x-text="errors.password"
                   class="flex items-center gap-1 text-xs text-red-500">
                    <i data-lucide="alert-circle" class="inline-block h-3 w-3"></i>
                </p>
            </div>

            <button type="button" @click="submit()"
                    class="mt-2 flex w-full items-center justify-center gap-2 rounded-lg bg-primary-700 px-4 py-3 text-sm font-semibold uppercase tracking-wider text-white transition-colors hover:bg-primary-800">
                <i data-lucide="log-in" class="h-4 w-4"></i>
                Ingresar
            </button>

            <div class="text-center">
                <a th:href="@{/participation}"
                   class="inline-flex items-center gap-1 text-xs text-zinc-400 transition-colors hover:text-primary-600">
                    <i data-lucide="arrow-left" class="h-3 w-3"></i>
                    Regresar al inicio
                </a>
            </div>

        </form>
    </div>

    <p class="mt-6 text-center text-xs text-white/60">
        Sistema Electoral - Lima Metropolitana
    </p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof lucide !== 'undefined') lucide.createIcons();
    });
</script>
</body>
</html>
