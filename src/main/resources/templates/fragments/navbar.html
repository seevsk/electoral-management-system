<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:x-transition="http://www.w3.org/1999/xhtml">

<nav th:fragment="navbar(activePage)" class="fixed left-0 top-0 z-40 flex h-16 w-full items-center bg-gradient-to-br from-primary-700 via-primary-800 to-primary-900 px-4 text-white shadow-lg">

    <!-- Logo + Title -->
    <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/10">
            <i data-lucide="vote" class="h-5 w-5"></i>
        </div>
        <span class="text-sm font-bold" th:text="#{navbar.app.name}">Sistema Electoral</span>
    </div>

    <!-- Spacer pushes everything right -->
    <div class="flex-1"></div>

    <!-- Desktop right section: nav links + language + login -->
    <div class="hidden items-center gap-6 md:flex">

        <!-- Nav links -->
        <div class="flex items-center gap-1">
            <a th:href="@{/participation}"
               th:class="'flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition-colors ' + (activePage == 'inicio' ? 'bg-white/10 text-white' : 'text-white hover:bg-white/5 hover:text-white')">
                <i data-lucide="users" class="h-4 w-4"></i>
                <span th:text="#{navbar.link.participation}">Participación Ciudadana</span>
            </a>
            <a th:href="@{/voting-location}"
               th:class="'flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition-colors ' + (activePage == 'voting-location' ? 'bg-white/10 text-white' : 'text-white hover:bg-white/5 hover:text-white')">
                <i data-lucide="map-pin" class="h-4 w-4"></i>
                <span th:text="#{navbar.link.voting.location}">Local de Votacion</span>
            </a>
            <a th:href="@{/presidencial}"
               th:class="'flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition-colors ' + (activePage == 'presidencial' ? 'bg-white/10 text-white' : 'text-white hover:bg-white/5 hover:text-white')">
                <i data-lucide="landmark" class="h-4 w-4"></i>
                <span th:text="#{navbar.link.presidential}">Resultados Presidenciales</span>
            </a>
        </div>

        <!-- Language selector (desktop) -->
        <div class="flex items-center gap-1 rounded-lg bg-white/10 px-2 py-1.5 text-xs font-semibold">
            <a th:href="@{''(lang='es')}"
               class="rounded px-2 py-1 transition-colors hover:bg-white/20"
               th:classappend="${#locale.language == 'es'} ? 'bg-white/20 text-white' : 'text-white/60'">
                ES
            </a>
            <span class="text-white/30">|</span>
            <a th:href="@{''(lang='en')}"
               class="rounded px-2 py-1 transition-colors hover:bg-white/20"
               th:classappend="${#locale.language == 'en'} ? 'bg-white/20 text-white' : 'text-white/60'">
                EN
            </a>
            <span class="text-white/30">|</span>
            <a th:href="@{''(lang='qu')}"
               class="rounded px-2 py-1 transition-colors hover:bg-white/20"
               th:classappend="${#locale.language == 'qu'} ? 'bg-white/20 text-white' : 'text-white/60'">
                QU
            </a>
        </div>

        <!-- Voter authenticated: show name + logout -->
        <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
            <div class="flex items-center gap-2 rounded-lg bg-white/10 px-3 py-2">
                <i data-lucide="user-check" class="h-4 w-4 text-white/70"></i>
                <span class="text-sm font-medium text-white" th:text="${#authentication.name}">Votante</span>
            </div>
            <form th:action="@{/auth/logout}" method="post">
                <button type="submit"
                        class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-white/70 transition-colors hover:bg-white/10 hover:text-white">
                    <i data-lucide="log-out" class="h-4 w-4"></i>
                    <span th:text="#{navbar.logout}">Salir</span>
                </button>
            </form>
        </div>

        <!-- Login dropdown: only when not authenticated -->
        <div sec:authorize="!isAuthenticated()"
             x-data="{ loginOpen: false }" class="relative">
            <button @click="loginOpen = !loginOpen"
                    class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-white/5 hover:text-white">
                <i data-lucide="log-in" class="h-4 w-4"></i>
                <span th:text="#{navbar.login}">Iniciar Sesión</span>
                <i data-lucide="chevron-down" class="h-3 w-3 transition-transform duration-200"
                   :class="{ 'rotate-180': loginOpen }"></i>
            </button>
            <div x-show="loginOpen"
                 @click.outside="loginOpen = false"
                 x-transition:enter="transition ease-out duration-150"
                 x-transition:enter-start="opacity-0 translate-y-1"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-100"
                 x-transition:leave-start="opacity-100 translate-y-0"
                 x-transition:leave-end="opacity-0 translate-y-1"
                 class="absolute right-0 top-full mt-1 w-48 space-y-1 rounded-lg border border-white/10 bg-primary-800 p-1.5 shadow-xl">
                <a th:href="@{/login/admin}"
                   class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-white/10 hover:text-white">
                    <i data-lucide="shield" class="h-4 w-4"></i>
                    <span th:text="#{navbar.login.admin}">Administrador</span>
                </a>
                <a th:href="@{/login/operator}"
                   class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-white/10 hover:text-white">
                    <i data-lucide="file-spreadsheet" class="h-4 w-4"></i>
                    <span th:text="#{navbar.login.operator}">Operador Electoral</span>
                </a>
                <a th:href="@{/login/voter}"
                   class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-white transition-colors hover:bg-white/10 hover:text-white">
                    <i data-lucide="user" class="h-4 w-4"></i>
                    <span th:text="#{navbar.login.voter}">Votante</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Mobile hamburger -->
    <button type="button"
            onclick="document.getElementById('mobile-nav-menu').classList.toggle('hidden'); document.getElementById('mobile-nav-overlay').classList.toggle('hidden')"
            class="ml-auto inline-flex items-center justify-center rounded-md p-2 text-white hover:bg-white/10 md:hidden">
        <i data-lucide="menu" class="h-6 w-6"></i>
    </button>

</nav>

<!-- Mobile menu overlay -->
<div id="mobile-nav-overlay" class="fixed inset-0 z-30 hidden bg-black/50 md:hidden"
     onclick="document.getElementById('mobile-nav-menu').classList.add('hidden'); this.classList.add('hidden')"></div>

<!-- Mobile menu drawer -->
<aside id="mobile-nav-menu" class="fixed left-0 top-0 z-40 hidden h-svh w-60 flex-col bg-gradient-to-br from-primary-700 via-primary-800 to-primary-900 p-4 text-white md:hidden">
    <div class="mb-8 flex items-center gap-3 px-2">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/10">
            <i data-lucide="vote" class="h-5 w-5"></i>
        </div>
        <span class="text-sm font-bold" th:text="#{navbar.app.name}">Sistema Electoral</span>
    </div>
    <nav class="flex flex-1 flex-col gap-1">
        <a th:href="@{/participation}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-white/5 hover:text-white">
            <i data-lucide="users" class="h-4 w-4"></i> <span th:text="#{navbar.link.participation}">Participación Ciudadana</span>
        </a>
        <a th:href="@{/voting-location}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-white/5 hover:text-white">
            <i data-lucide="map-pin" class="h-4 w-4"></i> <span th:text="#{navbar.link.voting.location}">Local de Votacion</span>
        </a>
        <a th:href="@{/presidencial}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-white/5 hover:text-white">
            <i data-lucide="landmark" class="h-4 w-4"></i> <span th:text="#{navbar.link.presidential}">Resultados Presidenciales</span>
        </a>
    </nav>

    <!-- Language selector (mobile) -->
    <div class="mb-2 flex items-center justify-center gap-1 rounded-lg bg-white/5 px-2 py-2 text-xs font-semibold">
        <a th:href="@{''(lang='es')}"
           class="rounded px-2 py-1 transition-colors hover:bg-white/20"
           th:classappend="${#locale.language == 'es'} ? 'bg-white/20 text-white' : 'text-white/60'">
            ES
        </a>
        <span class="text-white/30">|</span>
        <a th:href="@{''(lang='en')}"
           class="rounded px-2 py-1 transition-colors hover:bg-white/20"
           th:classappend="${#locale.language == 'en'} ? 'bg-white/20 text-white' : 'text-white/60'">
            EN
        </a>
        <span class="text-white/30">|</span>
        <a th:href="@{''(lang='qu')}"
           class="rounded px-2 py-1 transition-colors hover:bg-white/20"
           th:classappend="${#locale.language == 'qu'} ? 'bg-white/20 text-white' : 'text-white/60'">
            QU
        </a>
    </div>

    <!-- Mobile: voter authenticated -->
    <div sec:authorize="isAuthenticated()" class="border-t border-white/10 pt-4">
        <div class="mb-2 flex items-center gap-3 rounded-lg bg-white/5 px-3 py-2.5">
            <i data-lucide="user-check" class="h-4 w-4 text-white/70 shrink-0"></i>
            <span class="text-sm font-medium text-white" th:text="${#authentication.name}">Votante</span>
        </div>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit"
                    class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white">
                <i data-lucide="log-out" class="h-4 w-4 shrink-0"></i>
                <span class="flex-1 text-left" th:text="#{navbar.logout.full}">Cerrar sesión</span>
            </button>
        </form>
    </div>

    <!-- Mobile: login dropdown (not authenticated) -->
    <div sec:authorize="!isAuthenticated()"
         x-data="{ mobileNavLoginOpen: false }" class="border-t border-white/10 pt-4">
        <button @click="mobileNavLoginOpen = !mobileNavLoginOpen"
                class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white">
            <i data-lucide="log-in" class="h-4 w-4 shrink-0"></i>
            <span class="flex-1 text-left" th:text="#{navbar.login}">Iniciar Sesión</span>
            <i data-lucide="chevron-down" class="h-3 w-3 transition-transform duration-200"
               :class="{ 'rotate-180': mobileNavLoginOpen }"></i>
        </button>
        <div x-show="mobileNavLoginOpen"
             class="mb-2 mt-1 space-y-1 rounded-lg border border-white/10 bg-primary-800 p-1.5">
            <a th:href="@{/login/admin}"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/10 hover:text-white">
                <i data-lucide="shield" class="h-4 w-4"></i> <span th:text="#{navbar.login.admin}">Administrador</span>
            </a>
            <a th:href="@{/login/operator}"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/10 hover:text-white">
                <i data-lucide="file-spreadsheet" class="h-4 w-4"></i> <span th:text="#{navbar.login.operator}">Operador Electoral</span>
            </a>
            <a th:href="@{/login/voter}"
               class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/10 hover:text-white">
                <i data-lucide="user" class="h-4 w-4"></i> <span th:text="#{navbar.login.voter}">Votante</span>
            </a>
        </div>
    </div>
</aside>

</html>
