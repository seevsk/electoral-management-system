<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
    <title>Reportes - Sistema Electoral</title>
</head>
<body class="min-h-screen bg-zinc-50">

<div class="flex min-h-svh">

    <div th:replace="~{fragments/sidebar :: sidebar(activePage='reports')}"></div>

    <main class="flex-1 pl-0 md:pl-60">
        <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">

            <div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h1 class="font-heading text-3xl font-semibold text-zinc-900">Reportes Electorales</h1>
                    <p class="mt-1 text-sm text-zinc-500">Genera reportes consolidados del proceso electoral en Excel.</p>
                </div>
                <form th:action="@{/admin/reports/generate}" method="post">
                    <button type="submit"
                            class="inline-flex items-center gap-1.5 rounded-lg bg-primary-700 px-4 py-2.5 text-xs font-semibold uppercase tracking-wider text-white transition-colors hover:bg-primary-800">
                        <i data-lucide="file-spreadsheet" class="h-4 w-4"></i>
                        Generar reporte electoral
                    </button>
                </form>
            </div>

            <div th:if="${successMessage}"
                 class="mb-6 flex items-center gap-3 rounded-xl border border-emerald-600/20 bg-emerald-500/5 p-4 text-sm text-emerald-700">
                <i data-lucide="check-circle" class="h-5 w-5 shrink-0 text-emerald-600"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <div class="rounded-xl border border-zinc-200 bg-white shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead>
                        <tr class="border-b border-zinc-100 bg-zinc-50/50">
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">ID</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Tipo</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Estado</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Progreso</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Solicitado por</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Fecha creación</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Inicio</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Fin</th>
                            <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Archivo</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider text-zinc-500">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(reports)}">
                            <td colspan="10" class="px-4 py-12 text-center">
                                <div class="flex flex-col items-center gap-2">
                                    <i data-lucide="inbox" class="h-10 w-10 text-zinc-300"></i>
                                    <p class="text-sm text-zinc-500">Todavía no hay reportes generados.</p>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="report : ${reports}"
                            th:attr="data-report-id=${report.id}"
                            class="border-b border-zinc-50 transition-colors hover:bg-zinc-50">
                            <td class="px-4 py-4 text-zinc-700" th:text="${report.id}"></td>
                            <td class="px-4 py-4 text-zinc-700" th:text="${report.reportType}"></td>
                            <td class="px-4 py-4">
                                <span th:if="${report.status.name() == 'PENDING'}" class="report-status inline-flex items-center gap-1 rounded-full bg-amber-500/10 px-3 py-1 text-xs font-semibold text-amber-700" th:text="${report.status}"></span>
                                <span th:if="${report.status.name() == 'RUNNING'}" class="report-status inline-flex items-center gap-1 rounded-full bg-blue-500/10 px-3 py-1 text-xs font-semibold text-blue-700" th:text="${report.status}"></span>
                                <span th:if="${report.status.name() == 'COMPLETED'}" class="report-status inline-flex items-center gap-1 rounded-full bg-emerald-600/10 px-3 py-1 text-xs font-semibold text-emerald-700" th:text="${report.status}"></span>
                                <span th:if="${report.status.name() == 'FAILED'}" class="report-status inline-flex items-center gap-1 rounded-full bg-red-500/10 px-3 py-1 text-xs font-semibold text-red-600" th:text="${report.status}"></span>
                            </td>
                            <td class="px-4 py-4">
                                <div class="w-40">
                                    <div class="mb-1 flex justify-between text-xs text-zinc-500">
                                        <span class="report-progress-text" th:text="|${report.progressPercentage}%|"></span>
                                        <span th:text="|${report.processedRows}/${report.totalRows}|"></span>
                                    </div>
                                    <div class="h-2 w-full rounded-full bg-zinc-100">
                                        <div class="report-progress-bar h-2 rounded-full bg-primary-700"
                                             th:style="|width: ${report.progressPercentage}%|"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="px-4 py-4 text-zinc-700" th:text="${report.requestedBy}"></td>
                            <td class="px-4 py-4 text-zinc-600 text-xs" th:text="${report.createdAt}"></td>
                            <td class="px-4 py-4 text-zinc-600 text-xs" th:text="${report.startedAt != null ? report.startedAt : '-'}"></td>
                            <td class="px-4 py-4 text-zinc-600 text-xs" th:text="${report.finishedAt != null ? report.finishedAt : '-'}"></td>
                            <td class="px-4 py-4 text-zinc-600 text-xs">
                                <span th:text="${report.fileName != null ? report.fileName : '-'}"></span>
                                <div th:if="${report.status.name() == 'FAILED' and report.errorMessage != null}"
                                     class="mt-1 text-xs text-red-600" th:text="${report.errorMessage}"></div>
                            </td>
                            <td class="px-4 py-4 text-center">
                                <a th:if="${report.status.name() == 'COMPLETED'}"
                                   th:href="@{/admin/reports/{id}/download(id=${report.id})}"
                                   class="inline-flex items-center gap-1.5 rounded-lg border border-zinc-300 px-3 py-1.5 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-50">
                                    <i data-lucide="download" class="h-3.5 w-3.5"></i>
                                    Descargar Excel
                                </a>
                                <span th:unless="${report.status.name() == 'COMPLETED'}" class="text-xs text-zinc-300">—</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-8 border-t border-zinc-200 pt-4 text-center text-xs text-zinc-400">
                Sistema Electoral - Lima Metropolitana
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script>
    async function refreshReportRow(row) {
        const reportId = row.getAttribute('data-report-id');
        const res = await fetch(`/ems/admin/reports/${reportId}/status`);
        if (!res.ok) return;

        const data = await res.json();
        const statusCell = row.querySelector('.report-status');
        const progressText = row.querySelector('.report-progress-text');
        const progressBar = row.querySelector('.report-progress-bar');
        const fileCell = row.children[8];
        const actionsCell = row.children[9];

        if (statusCell) {
            statusCell.textContent = data.status;
            statusCell.className = 'report-status inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-semibold';
            if (data.status === 'PENDING') statusCell.classList.add('bg-amber-500/10', 'text-amber-700');
            if (data.status === 'RUNNING') statusCell.classList.add('bg-blue-500/10', 'text-blue-700');
            if (data.status === 'COMPLETED') statusCell.classList.add('bg-emerald-600/10', 'text-emerald-700');
            if (data.status === 'FAILED') statusCell.classList.add('bg-red-500/10', 'text-red-600');
        }

        if (progressText) progressText.textContent = `${data.progressPercentage}%`;
        if (progressBar) progressBar.style.width = `${data.progressPercentage}%`;

        if (fileCell) {
            fileCell.innerHTML = data.fileName ? `<span>${data.fileName}</span>` : '<span>-</span>';
            if (data.status === 'FAILED' && data.errorMessage) {
                fileCell.innerHTML += `<div class="mt-1 text-xs text-red-600">${data.errorMessage}</div>`;
            }
        }

        if (actionsCell && data.status === 'COMPLETED') {
            actionsCell.innerHTML = `<a href="/ems/admin/reports/${reportId}/download" class="inline-flex items-center gap-1.5 rounded-lg border border-zinc-300 px-3 py-1.5 text-xs font-medium text-zinc-700 transition-colors hover:bg-zinc-50"><i data-lucide="download" class="h-3.5 w-3.5"></i>Descargar Excel</a>`;
            if (window.lucide) lucide.createIcons();
        }
    }

    async function pollReports() {
        const rows = document.querySelectorAll('[data-report-id]');
        for (const row of rows) {
            const status = row.querySelector('.report-status')?.textContent?.trim();
            if (status === 'PENDING' || status === 'RUNNING') {
                try {
                    await refreshReportRow(row);
                } catch (e) {
                    console.error('Error actualizando reporte', e);
                }
            }
        }
    }

    setInterval(pollReports, 3000);
</script>

</body>
</html>
