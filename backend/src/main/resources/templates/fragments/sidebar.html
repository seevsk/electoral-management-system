<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="sidebar(activePage)" x-data>

    <!-- ==================== DESKTOP SIDEBAR ==================== -->
    <aside class="fixed left-0 top-0 z-40 hidden h-svh w-60 flex-col bg-gradient-to-br from-primary-700 via-primary-800 to-primary-900 p-4 text-white md:flex">

        <!-- Logo -->
        <div class="mb-8 flex items-center gap-3 px-2">
            <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/10">
                <i data-lucide="vote" class="h-5 w-5"></i>
            </div>
            <span class="text-sm font-bold">Sistema Electoral</span>
        </div>

        <!-- NOT authenticated: show login -->
        <template x-if="!$store.auth.authenticated">
            <div class="flex flex-1 flex-col justify-end">
                <div x-data="{ loginOpen: false }" class="border-t border-white/10 pt-4">
                    <button @click="loginOpen = !loginOpen"
                            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white">
                        <i data-lucide="log-in" class="h-4 w-4 shrink-0"></i>
                        <span class="flex-1 text-left">Iniciar Sesión</span>
                        <i data-lucide="chevron-down" class="h-3 w-3 transition-transform duration-200"
                           :class="{ 'rotate-180': loginOpen }"></i>
                    </button>
                    <div x-show="loginOpen"
                         @click.outside="loginOpen = false"
                         x-transition:enter="transition ease-out duration-150"
                         x-transition:enter-start="opacity-0 translate-y-1"
                         x-transition:enter-end="opacity-100 translate-y-0"
                         x-transition:leave="transition ease-in duration-100"
                         x-transition:leave-start="opacity-100 translate-y-0"
                         x-transition:leave-end="opacity-0 translate-y-1"
                         class="mb-2 mt-1 space-y-1 rounded-lg border border-white/10 bg-primary-800 p-1.5 shadow-xl">
                        <a th:href="@{/login/admin}"
                           class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/10 hover:text-white">
                            <i data-lucide="shield" class="h-4 w-4"></i>
                            Administrador
                        </a>
                        <a th:href="@{/login/voter}"
                           class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/10 hover:text-white">
                            <i data-lucide="user" class="h-4 w-4"></i>
                            Votante
                        </a>
                    </div>
                </div>
            </div>
        </template>

        <!-- Authenticated as admin: show admin links -->
        <template x-if="$store.auth.authenticated">
            <div class="flex flex-1 flex-col">
                <!-- User info -->
                <div class="mb-6 flex items-center gap-3 rounded-lg bg-white/5 px-3 py-2.5">
                    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-500">
                        <i data-lucide="shield" class="h-4 w-4 text-white"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-white" x-text="$store.auth.user.name"></p>
                        <p class="text-xs text-zinc-400">Administrador</p>
                    </div>
                </div>

                <!-- Admin navigation -->
                <nav class="flex flex-1 flex-col gap-1">
                    <a th:href="@{/admin/parties}"
                       th:class="'flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors ' + (activePage == 'parties' ? 'bg-white/10 text-white' : 'text-zinc-400 hover:bg-white/5 hover:text-white')">
                        <i data-lucide="vote" class="h-4 w-4"></i>
                        Partidos Políticos
                    </a>
                    <a th:href="@{/admin/candidates/list}"
                       th:class="'flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors ' + (activePage == 'candidates' ? 'bg-white/10 text-white' : 'text-zinc-400 hover:bg-white/5 hover:text-white')">
                        <i data-lucide="users" class="h-4 w-4"></i>
                        Candidatos
                    </a>
                    <a th:href="@{/admin/voters}"
                       th:class="'flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white'">
                        <i data-lucide="badge-check" class="h-4 w-4"></i>
                        Votantes
                    </a>
                </nav>

                <!-- Logout -->
                <div class="border-t border-white/10 pt-4">
                    <button @click="$store.auth.logout()"
                            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white">
                        <i data-lucide="log-out" class="h-4 w-4 shrink-0"></i>
                        <span class="flex-1 text-left">Cerrar sesión</span>
                    </button>
                </div>
            </div>
        </template>

    </aside>

    <!-- ==================== MOBILE SIDEBAR ==================== -->
    <!-- Mobile toggle button -->
    <button type="button"
            onclick="document.getElementById('mobile-sidebar').classList.toggle('hidden'); document.getElementById('mobile-overlay').classList.toggle('hidden')"
            class="fixed left-3 top-3 z-50 inline-flex items-center justify-center rounded-md p-2 text-zinc-500 hover:bg-zinc-100 md:hidden">
        <i data-lucide="menu" class="h-5 w-5"></i>
    </button>

    <!-- Mobile sidebar drawer -->
    <aside id="mobile-sidebar" class="fixed left-0 top-0 z-40 hidden h-svh w-60 flex-col bg-gradient-to-br from-primary-700 via-primary-800 to-primary-900 p-4 text-white md:hidden">
        <div class="mb-8 flex items-center gap-3 px-2">
            <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-white/10">
                <i data-lucide="vote" class="h-5 w-5"></i>
            </div>
            <span class="text-sm font-bold">Sistema Electoral</span>
        </div>

        <!-- NOT authenticated (mobile) -->
        <template x-if="!$store.auth.authenticated">
            <div class="flex flex-1 flex-col justify-end">
                <div x-data="{ mobileLoginOpen: false }" class="border-t border-white/10 pt-4">
                    <button @click="mobileLoginOpen = !mobileLoginOpen"
                            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white">
                        <i data-lucide="log-in" class="h-4 w-4 shrink-0"></i>
                        <span class="flex-1 text-left">Iniciar Sesión</span>
                        <i data-lucide="chevron-down" class="h-3 w-3 transition-transform duration-200"
                           :class="{ 'rotate-180': mobileLoginOpen }"></i>
                    </button>
                    <div x-show="mobileLoginOpen"
                         class="mb-2 mt-1 space-y-1 rounded-lg border border-white/10 bg-primary-800 p-1.5">
                        <a th:href="@{/login/admin}"
                            class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/10 hover:text-white">
                            <i data-lucide="shield" class="h-4 w-4"></i> Administrador
                        </a>
                        <a th:href="@{/login/voter}"
                            class="flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/10 hover:text-white">
                            <i data-lucide="user" class="h-4 w-4"></i> Votante
                        </a>
                    </div>
                </div>
            </div>
        </template>

        <!-- Authenticated as admin (mobile) -->
        <template x-if="$store.auth.authenticated">
            <div class="flex flex-1 flex-col">
                <div class="mb-6 flex items-center gap-3 rounded-lg bg-white/5 px-3 py-2.5">
                    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-primary-500">
                        <i data-lucide="shield" class="h-4 w-4 text-white"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-medium text-white" x-text="$store.auth.user.name"></p>
                        <p class="text-xs text-zinc-400">Administrador</p>
                    </div>
                </div>
                <nav class="flex flex-1 flex-col gap-1">
                    <a th:href="@{/admin/parties}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-white/5 hover:text-white">
                        <i data-lucide="vote" class="h-4 w-4"></i> Partidos Políticos
                    </a>
                    <a th:href="@{/admin/candidates/list}" th:class="'flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors ' + (activePage == 'candidates' ? 'bg-white/10 text-white' : 'text-zinc-400 hover:bg-white/5 hover:text-white')">
                        <i data-lucide="users" class="h-4 w-4"></i> Candidatos
                    </a>
                    <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white">
                        <i data-lucide="badge-check" class="h-4 w-4"></i> Votantes
                    </a>
                </nav>
                <div class="border-t border-white/10 pt-4">
                    <button @click="$store.auth.logout()"
                            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-white">
                        <i data-lucide="log-out" class="h-4 w-4 shrink-0"></i>
                        <span class="flex-1 text-left">Cerrar sesión</span>
                    </button>
                </div>
            </div>
        </template>

    </aside>

    <!-- Mobile overlay -->
    <div id="mobile-overlay" class="fixed inset-0 z-30 hidden bg-black/50 md:hidden"
         onclick="document.getElementById('mobile-sidebar').classList.add('hidden'); this.classList.add('hidden')"></div>

</div>

</html>
