<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partidos - Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="h3 mb-3">Registrar Partido</h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/parties/register}" th:object="${party}" method="post" enctype="multipart/form-data" class="row g-3">
                <div class="col-12">
                    <label for="name" class="form-label">Nombre</label>
                    <input id="name" type="text" class="form-control" th:field="*{name}" required>
                </div>
                <div class="col-12 col-md-4">
                    <label for="acronym" class="form-label">Siglas</label>
                    <input id="acronym" type="text" class="form-control" th:field="*{acronym}" required>
                </div>
                <div class="col-12 col-md-8">
                    <label for="representative" class="form-label">Representante</label>
                    <input id="representative" type="text" class="form-control" th:field="*{representative}" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="logoFile" class="form-label">Logo del Partido</label>
                    <input id="logoFile" name="logoFile" type="file" class="form-control" accept="image/*">
                </div>
                <div class="col-12">
                    <small class="text-secondary">El orden en lista (ONPE) se asigna automaticamente al registrar.</small>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/admin/parties/list}" class="btn btn-outline-secondary">Regresar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
